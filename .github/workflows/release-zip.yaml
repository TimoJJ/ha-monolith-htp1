name: "Attach release zip"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re-)attach the zip to"
        required: true

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Determine tag"
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: "Checkout repository at tag"
        uses: "actions/checkout@v4"
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: "Build monoprice_htp1.zip"
        run: |
          mkdir -p build/monoprice_htp1
          cp -r custom_components/monoprice_htp1/. build/monoprice_htp1/
          cd build
          zip -r ../monoprice_htp1.zip monoprice_htp1

      - name: "Upload zip to release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" monoprice_htp1.zip --clobber --repo ${{ github.repository }}
