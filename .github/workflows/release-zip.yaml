name: "Attach release zip"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re-)attach the zip to"
        required: true

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Determine tag"
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: "Checkout repository at tag"
        uses: "actions/checkout@v4"
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # HACS and the Marketplace unzip this file straight into custom_components/monoprice_htp1
      # (hacs.json: zip_release), so the integration files sit at the root of the zip.
      - name: "Build monoprice_htp1.zip"
        run: |
          cd custom_components/monoprice_htp1
          zip -r "$GITHUB_WORKSPACE/monoprice_htp1.zip" . -x "__pycache__/*" "*.pyc"

      # A release created with the zip already attached keeps it; a manual run replaces it.
      - name: "Upload zip to release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if [ "${{ github.event_name }}" = "release" ] && gh release view "$tag" --repo ${{ github.repository }} --json assets -q '.assets[].name' | grep -qx "monoprice_htp1.zip"; then
            echo "monoprice_htp1.zip is already attached to $tag"
            exit 0
          fi
          gh release upload "$tag" monoprice_htp1.zip --clobber --repo ${{ github.repository }}
